<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WashSlot – Monthly Laundry Booking Report</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/report.css">

  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <!-- SheetJS / XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

  <!-- Top App Navigation -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="logo-emoji">📊</span>
        <div class="brand-text">
          <h1>WashSlot Monthly Report</h1>
          <span class="brand-sub">Hostel Laundry History & Export</span>
        </div>
      </div>

      <div class="header-actions">
        <a href="dashboard.html" class="btn btn-secondary">
          <span>⬅ Back to Dashboard</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Report Main Section -->
  <main class="report-main">

    <!-- Filters Bar -->
    <section class="filters-card">
      <div class="filter-controls">

        <div class="filter-group">
          <label for="hostelSelect">Hostel</label>
          <select id="hostelSelect" class="filter-select">
            <option value="Hostel 1">Hostel 1</option>
            <option value="Hostel 2">Hostel 2</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="monthSelect">Month</label>
          <select id="monthSelect" class="filter-select">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="yearSelect">Year</label>
          <select id="yearSelect" class="filter-select">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
          </select>
        </div>

        <div class="filter-group search-group">
          <label for="searchInput">Search Register No</label>
          <input type="text" id="searchInput" placeholder="e.g. 23CS101" class="filter-input">
        </div>

      </div>

      <div class="filter-actions">
        <button class="btn btn-primary" onclick="loadReport()">
          <span>🔍 Load Report</span>
        </button>
        <button class="btn btn-outline" onclick="toggleSortByDate()">
          <span>↕️ Sort by Date <span id="sortDateIcon">▲</span></span>
        </button>
        <button class="btn btn-export-pdf" onclick="downloadPDF()">
          <span>📄 Download PDF</span>
        </button>
        <button class="btn btn-export-excel" onclick="downloadExcel()">
          <span>📊 Download Excel</span>
        </button>
      </div>
    </section>

    <!-- Table Section -->
    <section class="report-table-section">
      <div class="table-header-info">
        <h3 id="tableTitle">Monthly Laundry Bookings</h3>
        <span id="totalRecordsCount" class="total-badge">Total Bookings: 0</span>
      </div>

      <div class="table-wrapper">
        <table id="reportTable" class="report-table">
          <thead>
            <tr>
              <th onclick="toggleSortByDate()" class="sortable-th">
                Date <span class="sort-indicator">↕</span>
              </th>
              <th>Session</th>
              <th>Washing Machine</th>
              <th>Name</th>
              <th>Room No</th>
              <th>Department</th>
              <th>Register No</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rendered by report.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/report.js"></script>
</body>

</html>
